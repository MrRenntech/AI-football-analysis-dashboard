services:
  - type: web
    name: football-backend
    env: python
    buildCommand: pip install -r football_cv/requirements.txt
    startCommand: uvicorn football_cv.api.server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
  - type: web
    name: football-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
